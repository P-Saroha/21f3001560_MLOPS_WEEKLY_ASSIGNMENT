name: Week 4 CI Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python Dependencies
        run: |
          python -m pip install -r week-4/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication
        run: |
          gcloud auth list

      - name: Pull Versioned Data using DVC
        env:
          DVC_NO_ANALYTICS: "true"
          CI: "true"
        run: |
          cd week-2/example-versioning

          dvc doctor

          dvc pull || true

      - name: Run Tests
        run: |
          cd week-4
          python -m pytest tests -v

      - name: Generate Test Report
        run: |
          mkdir -p week-4/reports
          cd week-4
          python -m pytest tests -v | tee reports/report.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Publish CML Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Week 4 CI Report" > report.md
          echo "" >> report.md
          cat week-4/reports/report.txt >> report.md
          cml comment create report.md
