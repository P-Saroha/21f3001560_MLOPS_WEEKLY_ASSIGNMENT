name: Week 7 CI-CD Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  REPOSITORY: iris-repo
  IMAGE: iris-api
  CLUSTER_NAME: ${{ secrets.GKE_CLUSTER }}
  CLUSTER_ZONE: ${{ secrets.GKE_ZONE }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies
        run: |
          python -m pip install -r week-4/requirements.txt
          python -m pip install -r week-7/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Pull DVC Artifacts
        run: |
          cd week-2/example-versioning
          dvc pull || true

      - name: Run Tests
        run: |
          cd week-4
          pytest tests -v

      - name: Build Docker Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest \
            ./week-7

      - name: Push Docker Image
        run: |
          docker push \
            us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - name: Deploy to GKE
        run: |
          kubectl apply -f week-7/deployment.yaml
          kubectl apply -f week-7/service.yaml

      - name: Restart Deployment
        run: |
          kubectl rollout restart deployment iris-api
          kubectl rollout status deployment/iris-api --timeout=300s

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Get External IP
        run: |
          for i in {1..30}; do
            EXTERNAL_IP=$(kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$EXTERNAL_IP" ]; then
              echo "SERVICE_IP=$EXTERNAL_IP" >> $GITHUB_ENV
              echo "External IP: $EXTERNAL_IP"
              break
            fi
            echo "Waiting for External IP..."
            sleep 10
          done

      - name: Wait for Service to Become Reachable
        run: |
          echo "Waiting for service..."
          sleep 60

          for i in {1..10}; do
            if curl -fs http://$SERVICE_IP/; then
              echo "Service is reachable."
              exit 0
            fi
            echo "Retry $i/10..."
            sleep 15
          done

          echo "Service did not become reachable."
          exit 1

      - name: Stress Test with wrk
        run: |
          wrk -t4 -c1000 -d30s -s week-7/post.lua http://$SERVICE_IP/predict
