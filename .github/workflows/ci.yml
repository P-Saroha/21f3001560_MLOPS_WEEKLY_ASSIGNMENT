name: Week 4 CI Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r week-4/requirements.txt

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Verify Authentication
        run: |
          gcloud auth list

      - name: Pull Versioned Data using DVC
        run: |
          cd week-2/example-versioning
          dvc pull

      - name: Run Pytest
        run: |
          cd week-4
          python -m pytest tests -v

      - name: Generate Test Report
        run: |
          cd week-4
          python -m pytest tests -v > reports/report.txt

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Publish CML Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Week 4 Test Report" > report.md
          echo "" >> report.md
          cat week-4/reports/report.txt >> report.md
          cml comment create report.md
